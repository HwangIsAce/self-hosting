upstream api_backend {
    server api-gateway:8000;
    keepalive 32;
}

# Rate limiting zones (per client IP)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    # --- Until SSL is set up, serve directly on port 80 ---
    include /etc/nginx/conf.d/locations.conf;
}

