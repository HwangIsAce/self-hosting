# Upload size limit (500MB max — large documents for Docling/OCR)
client_max_body_size 500m;

# Public endpoints (no rate limit)
location = /health {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
}

location = / {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
}

location /docs {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
}

location /redoc {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
}

location /openapi.json {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
}

# Heavy endpoints: OCR and document processing (10 req/min)
location /v1/ocr {
    limit_req zone=api_heavy burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://api_backend;
    include /etc/nginx/conf.d/proxy_params.conf;
}

location /v1/documents {
    limit_req zone=api_heavy burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://api_backend;
    include /etc/nginx/conf.d/proxy_params.conf;
}

# General API endpoints (30 req/min)
location /v1/ {
    limit_req zone=api_general burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://api_backend;
    include /etc/nginx/conf.d/proxy_params.conf;
}
